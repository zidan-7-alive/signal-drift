name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'index.html', '.github/workflows/main.yml' ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK preinstalled on the runner
        run: |
          echo "SDK at: $ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          CT=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "cmdline-tools at: $CT"
          echo "$CT" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK licenses and install components
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses > /dev/null || true
          for i in 1 2 3; do
            sdkmanager "platforms;android-34" "build-tools;34.0.0" && break
            echo "sdkmanager attempt $i failed, retrying..."; sleep 5
          done
          sdkmanager --list_installed | tail -5

      - name: Install Gradle
        run: |
          for i in 1 2 3; do
            wget -q --tries=3 --timeout=60 https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip && break
            echo "gradle download attempt $i failed, retrying..."; sleep 5
          done
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Generate Android wrapper project around the game
        run: |
          set -e
          mkdir -p app/src/main/java/com/zidan/signaldrift app/src/main/assets
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html
          cp icon-192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'SignalDrift'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.zidan.signaldrift'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.zidan.signaldrift'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '0.10.6'
              }
              signingConfigs {
                  release {
                      storeFile file('../signal-drift.keystore')
                      storePassword 'signaldrift'
                      keyAlias 'signaldrift'
                      keyPassword 'signaldrift'
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Signal Drift"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"
                  android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/zidan/signaldrift/MainActivity.java <<'EOF'
          package com.zidan.signaldrift;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView wv;
              private void immersive() {
                  wv.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  wv = new WebView(this);
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
                  immersive();
              }
              @Override protected void onResume() { super.onResume(); immersive(); }
              @Override public void onBackPressed() {
                  if (wv != null && wv.canGoBack()) wv.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: signal-drift-apk-signed
          path: app/build/outputs/apk/release/app-release.apk
